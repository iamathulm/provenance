[project]
name = "provenance-api"
version = "0.1.0"
description = "Provenance API: grounded, cited answers over private document workspaces."
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.1",
  "psycopg[binary]>=3.3",
  "alembic>=1.20",
  "argon2-cffi>=25.1",
  "structlog>=26.1",
  "email-validator>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance"]
