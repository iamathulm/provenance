[project]
name = "provenance-workspace"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api"]

[tool.uv.sources]
provenance-api = { workspace = true }

[dependency-groups]
dev = [
  "provenance-api",
  "pytest>=8",
  "pytest-cov>=6",
  "httpx>=0.28",
  "ruff>=0.8",
  "mypy>=1.13",
  "vulture>=2.13",
  "pre-commit>=4",
  "pytest-asyncio>=1.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps/api/src", "apps/api/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "ARG", "ERA"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"apps/api/tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "apps/api/src"

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "-q"
pythonpath = ["apps/api"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
  "error",
  # Starlette's TestClient now recommends `httpx2`; keep `httpx` until that package is verified.
  "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.vulture]
paths = ["apps/api/src"]
min_confidence = 80
