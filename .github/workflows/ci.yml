name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: provenance
          POSTGRES_PASSWORD: provenance
          POSTGRES_DB: provenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provenance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.20.2-unprivileged
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://provenance:provenance@127.0.0.1:5432/provenance_test?connect_timeout=5
      TEST_QDRANT_URL: http://127.0.0.1:6333
      FASTEMBED_CACHE_DIR: ${{ github.workspace }}/.cache/fastembed
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Cache embedding and reranker models
        uses: actions/cache@v6
        with:
          path: |
            .cache/fastembed
            .cache/flashrank
          key: models-${{ hashFiles('apps/api/src/provenance/core/config.py') }}
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy apps/api/src
      - name: Dead code
        run: uv run vulture
      - name: Test
        run: uv run pytest --cov=provenance --cov-report=term-missing
      - name: Migrations match models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          uv run provenance migrate
          uv run alembic -c apps/api/alembic.ini check

  eval:
    name: eval
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: provenance
          POSTGRES_PASSWORD: provenance
          POSTGRES_DB: provenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provenance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.20.2-unprivileged
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://provenance:provenance@127.0.0.1:5432/provenance?connect_timeout=5
      QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Cache embedding and reranker models
        uses: actions/cache@v6
        with:
          path: |
            .cache/fastembed
            .cache/flashrank
          key: models-${{ hashFiles('apps/api/src/provenance/core/config.py') }}
      - name: Cache research papers
        uses: actions/cache@v6
        with:
          path: data/research/files
          key: research-${{ hashFiles('data/research/manifest.yaml') }}
      - name: Install
        run: uv sync --frozen
      - name: Index both demo corpora
        run: |
          uv run provenance migrate
          uv run provenance seed-demo --with-corpora
      - name: Retrieval gate (held-out test split)
        run: >-
          uv run provenance eval --split test --ablation
          --out eval-report --check eval/thresholds.yaml
      - name: SQL gate (held-out test split, replayed from cassettes)
        run: >-
          uv run provenance eval --suite sql --split test --domain company
          --out eval-report --check eval/thresholds.yaml
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: retrieval-eval
          path: eval-report/

  web:
    name: web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: apps/web/.nvmrc
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Dead code
        run: npm run knip
      - name: Build
        run: npm run build

  design:
    name: design
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint DESIGN.md
        run: npx --yes @google/design.md@0.4.0 lint DESIGN.md < /dev/null
