name: Answer evaluation

# Model-backed evaluation: Groq answers (replayed from committed cassettes when unchanged),
# RAGAS faithfulness and answer relevancy judged by Gemini (or Groq), and the guardrail
# comparison against Prompt Guard. Manual or weekly, never per PR: it spends free-tier quota.
# Needs repository secrets GROQ_API_KEY and (optionally) GEMINI_API_KEY.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: Golden items per domain and split
        default: "10"
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: answer-eval
  cancel-in-progress: false

jobs:
  answers:
    name: answers
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:17.12-alpine
        env:
          POSTGRES_USER: provenance
          POSTGRES_PASSWORD: provenance
          POSTGRES_DB: provenance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provenance"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.20.2-unprivileged
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c ':> /dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://provenance:provenance@127.0.0.1:5432/provenance?connect_timeout=5
      QDRANT_URL: http://127.0.0.1:6333
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      RAGAS_DO_NOT_TRACK: "true"
      LIMIT: ${{ inputs.limit || '10' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
      - name: Cache embedding and reranker models
        uses: actions/cache@v6
        with:
          path: |
            .cache/fastembed
            .cache/flashrank
          key: models-${{ hashFiles('apps/api/src/provenance/core/config.py') }}
      - name: Cache research papers
        uses: actions/cache@v6
        with:
          path: data/research/files
          key: research-${{ hashFiles('data/research/manifest.yaml') }}
      - name: Cache judge replies
        uses: actions/cache@v6
        with:
          path: .cache/ragas
          key: ragas-${{ github.run_id }}
          restore-keys: ragas-
      - name: Install (with the eval group)
        run: uv sync --frozen --group eval
      - name: Index both demo corpora
        run: |
          uv run provenance migrate
          uv run provenance seed-demo --with-corpora
      - name: Answers (dev and held-out test)
        run: |
          uv run provenance eval --suite answers --split dev --limit "$LIMIT" --out eval-report
          uv run provenance eval --suite answers --split test --limit "$LIMIT" --out eval-report
      - name: Guardrails
        run: uv run provenance eval --suite guardrails --out eval-report
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: answer-eval
          path: |
            eval-report/
            eval/cassettes/
