filename: employee-handbook.pdf
title: Kestrel Ridge Systems Employee Handbook
sections:
  - heading: Kestrel Ridge Systems Employee Handbook
    level: 1
    paragraphs:
      - This handbook applies to all employees of Kestrel Ridge Systems, an industrial drone manufacturer headquartered in Tacoma, Washington. It was last revised on 1 September 2026 and is owned by the People Operations team.
      - Where this handbook and a signed employment contract differ, the contract takes precedence. Questions go to people-ops@kestrelridge.example.
  - heading: Working hours
    level: 2
    paragraphs:
      - Kestrel Ridge uses flexible working hours with core collaboration hours from 10:00 to 15:00 local time, Monday to Friday. Outside core hours, employees choose their own schedule in agreement with their manager.
      - Flight operations and manufacturing staff work published shift rotations instead of flexible hours. Shift premiums are described in the compensation guide.
  - heading: Remote and hybrid work
    level: 2
    paragraphs:
      - Office-based roles may work remotely up to three days per week. Fully remote arrangements require written approval from a vice president and are reviewed every twelve months.
      - New employees receive a one-time home office stipend of 400 US dollars, paid with the first payroll after their start date.
  - heading: Probation
    level: 2
    paragraphs:
      - All new employees complete a 90-day probation period. During probation the notice period for either side is one week.
  - heading: Leave policy
    level: 2
    paragraphs:
      - Full-time employees receive 25 days of paid annual leave per calendar year in addition to 10 public holidays. Part-time employees receive leave pro rata.
      - Up to 5 unused annual leave days may be carried over into the next year. Carried-over days must be used by 31 March or they expire.
  - heading: Sick leave
    level: 3
    paragraphs:
      - Employees receive 10 days of paid sick leave per year. A doctor's note is required for absences longer than 3 consecutive working days.
  - heading: Parental leave
    level: 3
    paragraphs:
      - The primary caregiver receives 16 weeks of fully paid parental leave. The secondary caregiver receives 6 weeks of fully paid parental leave. Eligibility starts after 6 months of continuous employment.
      - Parental leave must begin within 12 months of the birth or adoption.
  - heading: Bereavement leave
    level: 3
    paragraphs:
      - Employees receive up to 5 days of paid bereavement leave for the loss of an immediate family member, and up to 2 days for extended family.
  - heading: Learning and development
    level: 2
    paragraphs:
      - Each employee has an annual learning budget of 1,500 US dollars for courses, certifications and conferences. Unused budget does not roll over. Remote pilot certification renewals for flight staff are paid separately and do not count against this budget.
  - heading: Equipment
    level: 2
    paragraphs:
      - Laptops are refreshed every 3 years. Lost or stolen equipment must be reported to IT and Security within 1 hour, following the Information Security Policy.
  - heading: Code of conduct and reporting
    level: 2
    paragraphs:
      - Employees are expected to treat colleagues, customers and partners with respect. Harassment and discrimination are not tolerated.
      - Concerns can be raised with a manager, with People Operations, or anonymously through the ethics hotline at ethics@kestrelridge.example. Retaliation against anyone who raises a concern in good faith is prohibited.
