# Research papers: long-form argument, dense terminology, results tables.
# Chunks stay under ~320 model tokens so the embedder (512) and reranker (384) see all of them.
name: research
display_name: Research papers
description: Academic papers with long sections, citations and result tables.
chunking:
  target_tokens: 220
  overlap_tokens: 40
  max_tokens: 320
  table_rows_per_chunk: 15
