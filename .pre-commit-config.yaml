repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy apps/api/src
        language: system
        pass_filenames: false
        files: ^apps/api/
      - id: vulture
        name: vulture
        entry: uv run vulture
        language: system
        pass_filenames: false
        files: ^apps/api/
      - id: web-lint
        name: web lint
        entry: npm --prefix apps/web run lint
        language: system
        pass_filenames: false
        files: ^apps/web/
